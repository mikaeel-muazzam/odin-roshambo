<!DOCTYPE html>
<html lang="en">
<head>
    <script defer src="./scripts/main.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    <p>Choose rock, paper, or scissors using the buttons below.</p>
    <div class="choices">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>
    <div class="results">
        <div class = humanScoreContainer>
            <span>Human score: </span>
            <span class="humanScore">0</span>
        </div>
        <div class="computerScoreContainer">
            <span>Computer score: </span>
            <span class="computerScore">0</span>
        </div>
        <p class="roundResult"></p>
    </div>
</body>
</html>
